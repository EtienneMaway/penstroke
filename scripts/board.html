// ---- runtime
const resize = () => { cv.width = Math.round((W + PAD.l + PAD.r) * SCALE); cv.height = Math.round((H + PAD.t + PAD.b) * SCALE); };

  const im = IMGS[name], k = Math.min(W / im.width, H / im.height);

// Every string a viewer reads or hears, in order, once each: what a translator has to cover.
window.strings = () => {

  const out = [];
  S.beats.forEach(b => {

// Look at the finished board of every stretch between wipes, and say what is wrong with it. Runs once, after the video.

    for (const pts of arrowsList) for (const l of labels) {
      const r = { x: l.x + 5, y: l.y + 5, w: l.w - 10, h: l.h - 10 };
      if (r.w <= 0 || r.h <= 0) continue;

      if (inside >= 3) warns.add(`an arrow runs through ${l.str.startsWith('icon:') ? 'an icon' : `the label "${l.str}"`}: start it from the side that faces its target`);
    }
    if (tall) {
      const zone = b => b.x < 50 * k - tol || b.x + b.w > W - 50 * k + tol || b.y < 150 * k - tol || b.y + b.h > H - 270 * k + tol;

let CAPTIONS = false;
window.setCaptions = on => { CAPTIONS = !!on; };
// Burned-in caption: the sentence being spoken, wrapped, on a dark pill at the foot of the board.
function caption(text) {

  const sc = SCRIPTS.find(k => k.re.test(text)), size = below ? 52 : W < H ? 30 : 28, max = below ? W - 120 : W - (W < H ? 100 : 200), pad = 14, lead = size * 1.3;
  g.font = `${sc?.bold ? 'bold ' : '600 '}${size}px ${sc ? sc.face + ',' : ''}system-ui,Arial,sans-serif`;

// ---- camera: a beat's `cam` moves the view. { rect: [x, y, w, h] } fits that region, { x, y, zoom } is a centre and a

window.frame = t => { draw(t); return cv.toDataURL('image/jpeg', 0.95); };
