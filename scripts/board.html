<!doctype html>
<html><body style="margin:0;background:#111"><canvas id="c"></canvas>
<script>
// Blackboard runtime. A scene file calls scene({...}); render.js then drives frame(t).
// Every coordinate is in logical board units (1280x720 by default), rendered at SCALE.
let SCALE = 1.5;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const FONT = '"Bradley Hand","Chalkboard SE","Marker Felt",cursive';
// Each script in a face that writes it properly: a Mac face first, then a Noto face for other systems. Only scripts

const SCRIPTS = [
  { re: /\p{Script=Hebrew}/u, face: '"Arial Hebrew","Noto Sans Hebrew"' },
  { urdu: true, re: /[\u0679\u0688\u0691\u06BA\u06BE\u06C1\u06D2]/u, face: '"Noto Nastaliq Urdu"' },   // letters only Urdu uses: written in nastaliq
  { arabic: true, re: /\p{Script=Arabic}/u, face: '"Traditional Arabic","Noto Naskh Arabic","Geeza Pro"' },
  { re: /\p{Script=Syriac}|\p{Script=Thaana}|\p{Script=Nko}/u, face: '"Noto Sans Syriac","Noto Sans Thaana","Noto Sans NKo"' },
  { re: /\p{Script=Devanagari}/u, face: '"Kohinoor Devanagari","Devanagari Sangam MN","Noto Sans Devanagari"' },
  { re: /\p{Script=Bengali}/u, face: '"Kohinoor Bangla","Bangla Sangam MN","Noto Sans Bengali"' },
  { re: /\p{Script=Gurmukhi}/u, face: '"Gurmukhi Sangam MN","Noto Sans Gurmukhi"' },
  { re: /\p{Script=Gujarati}/u, face: '"Kohinoor Gujarati","Gujarati Sangam MN","Noto Sans Gujarati"' },
  { re: /\p{Script=Tamil}/u, face: '"Tamil Sangam MN","Tamil MN","InaiMathi","Noto Sans Tamil"' },
  { re: /\p{Script=Telugu}/u, face: '"Kohinoor Telugu","Telugu Sangam MN","Noto Sans Telugu"' },
  { re: /\p{Script=Kannada}|\p{Script=Malayalam}|\p{Script=Sinhala}|\p{Script=Oriya}/u, face: '"Kannada Sangam MN","Malayalam Sangam MN","Sinhala Sangam MN","Oriya Sangam MN","Noto Sans Kannada","Noto Sans Malayalam","Noto Sans Sinhala","Noto Sans Oriya"' },
  { re: /\p{Script=Thai}|\p{Script=Lao}|\p{Script=Khmer}|\p{Script=Myanmar}|\p{Script=Tibetan}/u, face: '"Thonburi","Lao Sangam MN","Khmer Sangam MN","Myanmar Sangam MN","Kailasa","Noto Sans Thai Looped","Noto Looped Thai","Noto Sans Thai","Noto Sans Lao","Noto Sans Khmer","Noto Sans Myanmar","Noto Serif Tibetan"' },

const C = { yellow: '#ffe066', blue: '#4fc3f7', orange: '#ffb74d', pink: '#f48fb1',

// Light mode: marker colours on a white board. The names stay the same, so a scene needs no change.
const LIGHT = { yellow: '#cf8600', blue: '#1b74d3', orange: '#e6620a', pink: '#d5307a', green: '#1c9a4a', red: '#dc2f2f', purple: '#6d45c6', white: '#1c1c1c' };
const DARK = { ...C };
let BASE = 'dark', BG, PEN, GLOW;   // GLOW: the halo that lifts ink off a screenshot, dark behind chalk and white behind marker

const clamp = v => Math.max(0, Math.min(1, v));
const seg = (p, a, b) => clamp((p - a) / (b - a));   // a slice of a beat's 0..1 progress
let S = null, T = [], W = 1280, H = 720, pen = null;
const IMGS = {}, FADE = 0.3;   // screenshot backgrounds, and their cross-fade in seconds
const warns = new Set();
let labels = [];   // text boxes drawn this frame, to catch one label landing on another

// ---- shapes: each returns [x, y] points for stroke(). Wobble is sin-based, never
// Math.random, because every frame has to redraw the identical line.
function curve(a, b, ctrl, n = 40) {

  const amp = Math.min(2, Math.hypot(b[0] - a[0], b[1] - a[1]) / 80);   // short strokes get less wobble

    pts.push([v * v * a[0] + 2 * v * u * m[0] + u * u * b[0] + w, v * v * a[1] + 2 * v * u * m[1] + u * u * b[1] + w]);
  }

}
const line = (a, b) => curve(a, b);
function oval(cx, cy, rx, ry) {
  const pts = [];
  for (let i = 0; i <= 80; i++) {
    const a = -Math.PI / 2 + (i / 80) * Math.PI * 2.08, k = 1 + 0.03 * Math.sin(a * 3 + cx) + 0.025 * (i / 80);
    pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
  }

}
const ring = (r, pad = 8) => oval(r.x + r.w / 2, r.y + r.h / 2, r.w / 2 + pad, r.h / 2 + pad);   // circle a UI element from its {x, y, w, h}
const box = (x, y, w, h) => [].concat(curve([x, y], [x + w, y + 2], null, 14), curve([x + w, y + 2], [x + w - 2, y + h], null, 10),
                                      curve([x + w - 2, y + h], [x + 1, y + h - 2], null, 14), curve([x + 1, y + h - 2], [x - 2, y - 5], null, 10));

// view(captureWidth, cropTop) puts CSS-pixel numbers straight from getBoundingClientRect() onto the board,
// so nobody converts screenshot coordinates by hand. cropTop = CSS px cut off the top of the still.
const view = (cw, top = 0) => ({ p: (x, y) => [x * W / cw, (y - top) * W / cw],

// ---- drawing: (geometry..., p, style). p is 0..1; nothing is drawn at 0.

}
function write(str, x, y, p = 1, o = {}) {

  const face = sc?.arabic && (o.lang || S?.lang) === 'ur' ? URDU : sc?.face;

  const latin = !rtl && /\p{Script=Latin}/u.test((str.match(LETTER) || [''])[0]);

  g.fillStyle = o.color || C.white; g.textAlign = 'left';

  // Nastaliq also stacks its letters far above the line.
  const ink0 = shaped ? lx - m.actualBoundingBoxLeft : lx, ink1 = shaped ? lx + m.actualBoundingBoxRight : lx + full;
  const top = shaped ? y - Math.max(size * 0.8, m.actualBoundingBoxAscent) : y - size * 0.8, bot = shaped ? y + m.actualBoundingBoxDescent : y + size * 0.2;

  // so shape the whole string once and uncover it in writing order.

  for (const d of [2.6, -2.6]) stroke([e, [e[0] + Math.cos(ang + d) * 22, e[1] + Math.sin(ang + d) * 22]], 1, o);

function check(x, y, p = 1, o = {}) {   // glyphs like a tick are missing from the handwriting font, so draw them

  stroke(curve([x, y + s * 0.55], mid, null, 8).concat(curve(mid, [x + s, y], null, 14)), p, { color: C.green, width: 6, ...o });

// ---- icons: small hand-drawn pictures built from the same wobbly strokes as everything else.
// icon(name, cx, cy, p, {size, color, width}) draws one centred on (cx, cy), stroke by stroke as p runs 0..1.
// Each icon is drawn in a 100x100 box. Ops: l line, c curve (with ctrl), o oval, b box, p polyline, a elliptical arc (degrees, 0 = right, 90 = down).
const ellArc = (cx, cy, rx, ry, a0, a1, n = 28) => {
  const pts = [];

const polar = (n, r0, r1, rot = -90) => Array.from({ length: n * 2 + 1 }, (_, i) => {
  const a = (rot + i * 180 / n) * Math.PI / 180, r = i % 2 ? r1 : r0;

const ICONS = {
  person: [['o', 50, 22, 13, 13], ['l', [50, 36], [50, 68]], ['p', [[24, 52], [50, 45], [76, 52]]], ['p', [[30, 94], [50, 68], [70, 94]]]],
  computer: [['b', 10, 14, 80, 52], ['l', [50, 66], [50, 82]], ['l', [28, 84], [72, 84]]],
  laptop: [['b', 22, 20, 56, 40], ['p', [[22, 60], [8, 78], [92, 78], [78, 60]]]],
  phone: [['b', 30, 6, 40, 88], ['l', [43, 82], [57, 82]]],
  server: [['b', 14, 8, 72, 22], ['b', 14, 39, 72, 22], ['b', 14, 70, 72, 22], ['o', 28, 19, 3, 3], ['o', 28, 50, 3, 3], ['o', 28, 81, 3, 3]],
  database: [['o', 50, 22, 32, 11], ['l', [18, 22], [18, 76]], ['l', [82, 22], [82, 76]], ['a', 50, 76, 32, 11, 0, 180], ['a', 50, 49, 32, 11, 0, 180]],
  cloud: [['a', 30, 62, 15, 15, 90, 270], ['a', 48, 42, 20, 22, 205, 335], ['a', 72, 56, 17, 20, 275, 450], ['l', [30, 77], [72, 76]]],
  brain: [['p', lumpy(50, 46, 40, 30, 9, 0.07)], ['c', [50, 17], [50, 76], [45, 46]], ['c', [20, 46], [42, 40], [30, 28]], ['c', [24, 62], [42, 58], [34, 48]], ['c', [80, 46], [58, 40], [70, 28]], ['c', [76, 62], [58, 58], [66, 48]], ['c', [54, 76], [62, 92], [64, 82]]],

  bulb: [['a', 50, 38, 25, 25, 125, 415], ['p', [[36, 58], [40, 72], [60, 72], [64, 58]]], ['l', [42, 82], [58, 82]], ['l', [45, 91], [55, 91]]],
  lock: [['b', 22, 44, 56, 44], ['a', 50, 44, 18, 22, 180, 360], ['o', 50, 62, 5, 5], ['l', [50, 67], [50, 78]]],

  keyboard: [['b', 6, 26, 88, 48], ['l', [16, 38], [26, 38]], ['l', [36, 38], [46, 38]], ['l', [56, 38], [66, 38]], ['l', [76, 38], [84, 38]], ['l', [16, 50], [30, 50]], ['l', [40, 50], [50, 50]], ['l', [60, 50], [70, 50]], ['l', [78, 50], [84, 50]], ['l', [28, 63], [72, 63]]],

  clock: [['o', 50, 50, 38, 38], ['l', [50, 50], [50, 26]], ['l', [50, 50], [68, 60]]],
  speaker: [['p', [[10, 38], [28, 38], [50, 18], [50, 82], [28, 62], [10, 62], [10, 38]]], ['a', 54, 50, 16, 16, -50, 50], ['a', 54, 50, 30, 30, -50, 50]],

function icon(name, cx, cy, p = 1, o = {}) {

// ---- runtime
window.scene = s => { S = s; if (s.theme) setTheme(s.theme); [W, H] = s.size || [W, H]; cv.width = W * SCALE; cv.height = H * SCALE; };

// Burned-in caption: the sentence being spoken, wrapped, on a dark pill at the foot of the board.

  for (let i = 0; i < labels.length; i++) for (let j = i + 1; j < labels.length; j++) {
    const a = labels[i], b = labels[j]; if (a.str === b.str) continue;
    const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x), oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
    if (ox > 0 && oy > 0 && ox * oy > 0.15 * Math.min(a.w * a.h, b.w * b.h)) warns.add(`labels overlap: "${a.str}" and "${b.str}"`);
  }
  if (CAPTIONS && !S.audio) {
    const i = S.beats.findIndex((b, k) => b.say && t >= T[k].start && t < T[k].start + T[k].dur + 0.15);
    if (i >= 0) caption(S.beats[i].say);
  }
  if (pen) { g.fillStyle = PEN; g.shadowColor = PEN; g.shadowBlur = 12; g.beginPath(); g.arc(pen[0], pen[1], 5, 0, 7); g.fill(); g.shadowBlur = 0; }
  return cv.toDataURL('image/jpeg', 0.95);
};
